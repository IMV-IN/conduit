name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  GO_VERSION: "1.26"

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: go build ./...
      - run: go vet ./...
      - run: go test -count=1 ./internal/... ./pkg/...
      - run: go test -race -count=1 ./internal/router/... ./internal/stats/... ./internal/health/... ./internal/classify/...
      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          staticcheck ./...
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
      - name: router bench (regression guard)
        run: go test -run xxx -bench . -benchmem ./internal/router/... | tee bench.txt
      - uses: actions/upload-artifact@v4
        with:
          name: bench
          path: bench.txt

  # Best-effort dataset refresh: self-provisions python deps, uses secrets
  # only if present, and never fails the build (fetch.py skips sources
  # whose creds are absent). Artifact feeds classifier-F1 review, not gates.
  datasets:
    runs-on: ubuntu-latest
    needs: go
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tools/datasets/requirements.txt
      - name: install dataset tooling (if not cached)
        run: pip install -r tools/datasets/requirements.txt
      - name: fetch public samples
        run: python3 tools/datasets/fetch.py --out test/datasets --max-per-source 200
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: datasets
          path: |
            test/datasets/extended.jsonl
            test/datasets/SOURCES.md

  # Short end-to-end gate: compose + mock + k6 01/02/03(errors).
  # Needs k6 v0.55+. Nightly runs the full matrix (see nightly.yml).
  e2e:
    runs-on: ubuntu-latest
    needs: go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: build images
        run: docker compose -f deploy/docker-compose.yml build conduit mock
      - name: start stack
        run: |
          CONDUIT_ADMIN_KEY=${{ secrets.CONDUIT_ADMIN_KEY || 'admin-dev' }} \
          CONDUIT_DEV_KEY=${{ secrets.CONDUIT_DEV_KEY || 'sk-conduit-dev' }} \
          docker compose -f deploy/docker-compose.yml up -d conduit mock
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/healthz && break || sleep 2
          done
          curl -sf http://localhost:8080/healthz
      - name: k6 short suites
        run: |
          mkdir -p test-results && chmod 777 test-results   # dir must be world-writable: the k6 container runs as non-root, else /results writes fail with permission denied
          docker run --rm --network host -w /test \
            -e BASE=http://localhost:8080 -e ADMIN=http://localhost:8081 -e MOCK=http://localhost:9001 \
            -e RESULTS_DIR=/results \
            -e CONDUIT_KEY=${{ secrets.CONDUIT_DEV_KEY || 'sk-conduit-dev' }} \
            -e CONDUIT_ADMIN_KEY=${{ secrets.CONDUIT_ADMIN_KEY || 'admin-dev' }} \
            -v "$PWD/test:/test:ro" -v "$PWD/test-results:/results" \
            grafana/k6:0.55.0 run /test/k6/01_overhead.js --env RATE=300 --env DUR=15s
          docker run --rm --network host -w /test \
            -e BASE=http://localhost:8080 -e ADMIN=http://localhost:8081 -e MOCK=http://localhost:9001 \
            -e RESULTS_DIR=/results \
            -e CONDUIT_KEY=${{ secrets.CONDUIT_DEV_KEY || 'sk-conduit-dev' }} \
            -e CONDUIT_ADMIN_KEY=${{ secrets.CONDUIT_ADMIN_KEY || 'admin-dev' }} \
            -v "$PWD/test:/test:ro" -v "$PWD/test-results:/results" \
            grafana/k6:0.55.0 run /test/k6/02_accuracy.js
          docker run --rm --network host -w /test \
            -e BASE=http://localhost:8080 -e ADMIN=http://localhost:8081 -e MOCK=http://localhost:9001 \
            -e RESULTS_DIR=/results \
            -e CONDUIT_KEY=${{ secrets.CONDUIT_DEV_KEY || 'sk-conduit-dev' }} \
            -e CONDUIT_ADMIN_KEY=${{ secrets.CONDUIT_DEV_KEY || 'admin-dev' }} \
            -e FAULT=errors \
            -v "$PWD/test:/test:ro" -v "$PWD/test-results:/results" \
            grafana/k6:0.55.0 run /test/k6/03_chaos.js
      - name: overhead gate
        run: make verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k6-results
          path: test-results/
      - name: teardown
        if: always()
        run: docker compose -f deploy/docker-compose.yml down -v
