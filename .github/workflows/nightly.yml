name: nightly

# Full suites 01–04 on a schedule + weekly soak. Publishes raw JSON for
# regression tracking. Alert threshold: >20% regression vs the checked-in
# baseline in test-results/baseline/ (see docs/TESTING.md §4).
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

env:
  GO_VERSION: "1.27"

jobs:
  full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: docker compose -f deploy/docker-compose.yml up -d --build conduit mock
      - run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/healthz && break || sleep 2
          done
      - name: full k6 suites (dockerized k6; runner has no k6 binary)
        run: |
          mkdir -p test-results && chmod 777 test-results
          # Fresh gateway per suite: Beta posteriors, EWMA, breakers and
          # ejection state are in-memory and must not leak across suites
          # (04_learning in particular teaches cost/quality tradeoffs that
          # would otherwise poison 03's healthy pre-window).
          restart_conduit() {
            docker compose -f deploy/docker-compose.yml restart conduit
            for i in $(seq 1 30); do
              curl -sf http://localhost:8080/healthz && break || sleep 2
            done
          }
          k6run() {
            docker run --rm --network host -w /test \
              -e BASE=http://localhost:8080 -e ADMIN=http://localhost:8081 -e MOCK=http://localhost:9001 \
              -e RESULTS_DIR=/results \
              -e CONDUIT_KEY=${{ secrets.CONDUIT_DEV_KEY || 'sk-conduit-dev' }} \
              -e CONDUIT_ADMIN_KEY=${{ secrets.CONDUIT_ADMIN_KEY || 'admin-dev' }} \
              ${FAULT:+-e FAULT=$FAULT} \
              -v "$PWD/test:/test:ro" -v "$PWD/test-results:/results" \
              grafana/k6:2.3.0 run /test/k6/$1
          }
          # Order matters: learning (04) runs last so its feedback cannot
          # shift routing for the other suites.
          for suite in 01_overhead.js 02_accuracy.js; do
            restart_conduit; k6run $suite
          done
          for fault in errors down slow; do
            restart_conduit; FAULT=$fault k6run 03_chaos.js
          done
          # 04's accuracy-vs-best verdict is a known tuning gap (see
          # docs/TESTING.md §7): run for the artifact, don't gate on it.
          restart_conduit; k6run 04_learning.js || echo "::warning::04_learning verdict failed (known gap, artifact kept)"

      - name: soak (weekly only)
        if: github.event.schedule == '0 3 * * 0' || github.event_name == 'workflow_dispatch'
        run: |
          docker run --rm --network host -w /test \
            -e BASE=http://localhost:8080 -e ADMIN=http://localhost:8081 -e MOCK=http://localhost:9001 \
            -e RESULTS_DIR=/results \
            -e CONDUIT_KEY=${{ secrets.CONDUIT_DEV_KEY || 'sk-conduit-dev' }} \
            -e CONDUIT_ADMIN_KEY=${{ secrets.CONDUIT_ADMIN_KEY || 'admin-dev' }} \
            -v "$PWD/test:/test:ro" -v "$PWD/test-results:/results" \
            grafana/k6:2.3.0 run /test/k6/05_soak.js
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: nightly-results
          path: test-results/
      - if: always()
        run: docker compose -f deploy/docker-compose.yml down -v
