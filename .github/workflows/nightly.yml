name: nightly

# Full suites 01–04 on a schedule + weekly soak. Publishes raw JSON for
# regression tracking. Alert threshold: >20% regression vs the checked-in
# baseline in test-results/baseline/ (see docs/TESTING.md §4).
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

env:
  GO_VERSION: "1.27"

jobs:
  full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: docker compose -f deploy/docker-compose.yml up -d --build conduit mock
      - run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/healthz && break || sleep 2
          done
      - name: full k6 suites (dockerized k6; runner has no k6 binary)
        run: |
          mkdir -p test-results && chmod 777 test-results
          for suite in 01_overhead.js 02_accuracy.js 04_learning.js; do
            docker run --rm --network host -w /test \
              -e BASE=http://localhost:8080 -e ADMIN=http://localhost:8081 -e MOCK=http://localhost:9001 \
              -e RESULTS_DIR=/results \
              -e CONDUIT_KEY=${{ secrets.CONDUIT_DEV_KEY || 'sk-conduit-dev' }} \
              -e CONDUIT_ADMIN_KEY=${{ secrets.CONDUIT_ADMIN_KEY || 'admin-dev' }} \
              -v "$PWD/test:/test:ro" -v "$PWD/test-results:/results" \
              grafana/k6:2.3.0 run /test/k6/$suite
          done
          for fault in errors down slow; do
            docker run --rm --network host -w /test \
              -e BASE=http://localhost:8080 -e ADMIN=http://localhost:8081 -e MOCK=http://localhost:9001 \
              -e RESULTS_DIR=/results \
              -e CONDUIT_KEY=${{ secrets.CONDUIT_DEV_KEY || 'sk-conduit-dev' }} \
              -e CONDUIT_ADMIN_KEY=${{ secrets.CONDUIT_ADMIN_KEY || 'admin-dev' }} \
              -e FAULT=$fault \
              -v "$PWD/test:/test:ro" -v "$PWD/test-results:/results" \
              grafana/k6:2.3.0 run /test/k6/03_chaos.js
          done
      - name: soak (weekly only)
        if: github.event.schedule == '0 3 * * 0' || github.event_name == 'workflow_dispatch'
        run: |
          docker run --rm --network host -w /test \
            -e BASE=http://localhost:8080 -e ADMIN=http://localhost:8081 -e MOCK=http://localhost:9001 \
            -e RESULTS_DIR=/results \
            -e CONDUIT_KEY=${{ secrets.CONDUIT_DEV_KEY || 'sk-conduit-dev' }} \
            -e CONDUIT_ADMIN_KEY=${{ secrets.CONDUIT_ADMIN_KEY || 'admin-dev' }} \
            -v "$PWD/test:/test:ro" -v "$PWD/test-results:/results" \
            grafana/k6:2.3.0 run /test/k6/05_soak.js
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: nightly-results
          path: test-results/
      - if: always()
        run: docker compose -f deploy/docker-compose.yml down -v
