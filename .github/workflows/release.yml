name: release

# Binaries via GoReleaser + images to Docker Hub and GHCR.
# Required repository secrets (Settings → Secrets and variables → Actions):
#   DOCKERHUB_USERNAME, DOCKERHUB_TOKEN  (Docker Hub access token)
#   CONDUIT_ADMIN_KEY, CONDUIT_DEV_KEY   (only for smoke tests; dev defaults used otherwise)
# Optional:
#   HF_TOKEN  (validates dataset refresh in the release notes job)
#
# Maintainers: Docker Hub repo name is configured with the
# `dockerhub_repo` environment variable (default: conduit).
# Contributors: fork + set these secrets in your fork to test the pipeline.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  packages: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_REPO: ${{ vars.DOCKERHUB_REPO || 'conduit' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true
      - name: login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
