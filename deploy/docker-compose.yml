name: conduit

services:
  conduit:
    build: { context: .., dockerfile: deploy/Dockerfile, target: conduit }
    image: "${CONDUIT_IMAGE:-conduit:dev}"
    ports: ["8080:8080", "8081:8081"]
    environment:
      CONDUIT_ADMIN_KEY: ${CONDUIT_ADMIN_KEY:-admin-dev}
      CONDUIT_DEV_KEY: ${CONDUIT_DEV_KEY:-sk-conduit-dev}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - conduit-data:/data
      - ../conduit.example.yaml:/etc/conduit/conduit.yaml:ro
    depends_on: [mock]
    healthcheck:
      test: ["CMD", "/conduit", "healthcheck"]
      interval: 5s
      timeout: 2s
      retries: 10

  mock:
    build: { context: .., dockerfile: deploy/Dockerfile, target: mock }
    ports: ["9001:9001"]

  prometheus:
    image: prom/prometheus:latest
    profiles: ["obs"]
    volumes: ["./prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:latest
    profiles: ["obs"]
    ports: ["3000:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    depends_on: [prometheus]

  k6:
    image: grafana/k6:latest
    profiles: ["test"]
    volumes: ["../test:/test:ro", "../test-results:/results"]
    working_dir: /test
    environment:
      BASE: http://conduit:8080
      ADMIN: http://conduit:8081
      MOCK: http://mock:9001
      RESULTS_DIR: /results
      CONDUIT_KEY: ${CONDUIT_DEV_KEY:-sk-conduit-dev}
      CONDUIT_ADMIN_KEY: ${CONDUIT_ADMIN_KEY:-admin-dev}
    depends_on: [conduit]
    entrypoint: ["k6"]

volumes:
  conduit-data:
